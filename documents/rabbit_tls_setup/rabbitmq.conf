# Disable unencrypted AMQP
listeners.tcp = none

# TLS AMQP listener
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca_cert.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server_cert.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server_key.pem

# Enforce mutual TLS
ssl_options.verify               = verify_peer
ssl_options.fail_if_no_peer_cert = true

# Management UI, also requiring client certs
management.ssl.port                 = 15671
management.ssl.cacertfile           = /etc/rabbitmq/certs/ca_cert.pem
management.ssl.certfile             = /etc/rabbitmq/certs/server_cert.pem
management.ssl.keyfile              = /etc/rabbitmq/certs/server_key.pem
management.ssl.verify               = verify_peer
management.ssl.fail_if_no_peer_cert = true

# Authenticate clients by their certificate's Common Name (EXTERNAL auth)
auth_mechanisms.1   = EXTERNAL
ssl_cert_login_from = common_name