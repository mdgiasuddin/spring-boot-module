server:
  port: 8197
spring:
  application:
    name: db-partition

  datasource:
    url: jdbc:postgresql://localhost:5435/db_partition
    username: postgres
    password: pass_1234
    driver-class-name: org.postgresql.Driver

  # Jpa properties
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect