name: spring_boot_test
services:
  db:
    image: postgres:18.6
    container_name: postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: pass_1234
    ports:
      - "5435:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql/<major>/docker, so mount the parent dir
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: