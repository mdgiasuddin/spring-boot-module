services:

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    environment:
      REDIS_ARGS: >
        --appendonly yes
        --maxmemory 3gb
        --maxmemory-policy noeviction

volumes:
  redis_data: